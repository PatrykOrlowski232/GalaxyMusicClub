services:
  mysql:
    image: mysql:8.4
    container_name: galaxy-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: galaxy_root
      MYSQL_DATABASE: galaxy
      MYSQL_USER: galaxy
      MYSQL_PASSWORD: galaxy
    volumes:
      - galaxy_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  galaxy_mysql_data:
